# Render Blueprint — deploys the FastAPI backend.
# Render reads this from the REPO ROOT; rootDir points it at backend/.
# Create via render.com → New → Blueprint → connect this repo.
services:
  - type: web
    name: unified-messenger-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Demo mode: serves realistic sample data for every platform so the live
      # link works with zero credentials. Flip to false once you wire tokens.
      - key: DEMO_MODE
        value: "true"
      # Optional shared secret to lock the API/WebSocket. Leave unset for the
      # public demo; set in the dashboard (sync:false) + rebuild the web app
      # with --dart-define=API_KEY=<same value> to enforce.
      - key: API_KEY
        sync: false
      # Optional Firebase service-account path for FCM push (see
      # app/fcm_setup/SETUP_FCM.md). Unset = push disabled, everything else works.
      - key: FIREBASE_CREDENTIALS
        sync: false
